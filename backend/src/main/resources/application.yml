# =============================================================
# 校园报修预约系统 后端配置
# =============================================================

server:
  port: 8080
  servlet:
    # 所有接口统一挂载在 /api 前缀下（契约基础地址 http://localhost:8080/api）
    context-path: /api

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 数据库连接：请按本机 MySQL 实际情况修改用户名/密码
    url: jdbc:mysql://localhost:3306/campus_repair?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: 123456
  servlet:
    multipart:
      # 文件上传限制：单文件与单请求均不超过 5MB
      max-file-size: 5MB
      max-request-size: 5MB
  jackson:
    # 全局日期格式（java.util.Date）；LocalDateTime 的格式见 JacksonConfig
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8

mybatis-plus:
  configuration:
    # 数据库下划线字段自动映射为 Java 驼峰属性
    map-underscore-to-camel-case: true
  global-config:
    banner: false

# JWT 配置：HS256 要求密钥至少 32 字节；令牌有效期 7 天
jwt:
  secret: campus-repair-system-jwt-secret-key-2026
  expire-days: 7

# 图片上传目录：相对应用启动目录（默认 backend/uploads，运行时自动创建）
file:
  upload-dir: uploads

logging:
  level:
    com.campus.repair: info

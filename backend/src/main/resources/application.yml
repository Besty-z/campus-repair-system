# =============================================================
# 校园报修预约系统 后端配置
# =============================================================

server:
  port: 8080
  servlet:
    # 所有接口统一挂载在 /api 前缀下（契约基础地址 http://localhost:8080/api）
    context-path: /api

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 数据库连接：账号密码通过环境变量注入，避免把本机真实密码写进代码
    # 未设置环境变量时使用冒号后的默认值（本机密码不是 123456 时，请设置 MYSQL_PASSWORD）
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DB:campus_repair}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:123456}
  servlet:
    multipart:
      # 文件上传限制：单文件与单请求均不超过 5MB
      max-file-size: 5MB
      max-request-size: 5MB
  jackson:
    # 全局日期格式（java.util.Date）；LocalDateTime 的格式见 JacksonConfig
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8

mybatis-plus:
  configuration:
    # 数据库下划线字段自动映射为 Java 驼峰属性
    map-underscore-to-camel-case: true
  global-config:
    banner: false

# JWT 配置：HS256 要求密钥至少 32 字节；令牌有效期 7 天
jwt:
  secret: campus-repair-system-jwt-secret-key-2026
  expire-days: 7

# 图片上传目录：相对应用启动目录（默认 backend/uploads，运行时自动创建）
file:
  upload-dir: uploads

# AI 大模型配置：
# DeepSeekLlmClient 始终作为唯一的 LlmClient 实现生效。
# 密钥来源优先级：请求体 apiKey（前端/小程序用户配置）> 环境变量 DEEPSEEK_API_KEY。
# 当两者均为空时，自动回退到 MockLlmClient 的模拟报修建议，助手仍可用。
# 如需使用服务端统一密钥，请设置环境变量 DEEPSEEK_API_KEY（切勿写入配置文件或提交到仓库）。
llm:
  base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
  api-key: ${DEEPSEEK_API_KEY:}
  model: ${DEEPSEEK_MODEL:deepseek-chat}

logging:
  level:
    com.campus.repair: info
